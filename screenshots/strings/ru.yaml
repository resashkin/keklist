# Подписи к скриншотам в сторах. Порядок = порядок скриншотов. Каждая — одна короткая строка.
day: Ваш личный дневник
emotions: Называйте то, что чувствуете
insights: Развивайте эмоциональный интеллект
voice: Скажите голосом или снимите кружок
gallery: Фото сами становятся дневником
calendar: Вернитесь в любой день
web: Откройте на компьютере. Сервер — ваш телефон.
privacy: Всё хранится только на телефоне
